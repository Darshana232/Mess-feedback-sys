version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0-alpine
    container_name: messmate-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mess-feedback
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.adminCommand("ping")' | mongosh localhost/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messmate-network

  # Backend API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: messmate-backend
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/mess-feedback
      PORT: 5001
      CORS_ORIGINS: http://localhost:80,http://localhost:5173,http://localhost:3000
      COLLEGE_DOMAIN: ${COLLEGE_DOMAIN:-sst.scaler.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./server/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messmate-network

  # Frontend Application
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: messmate-frontend
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://backend:5001
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    depends_on:
      - backend
    volumes:
      - ./client/dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messmate-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  messmate-network:
    driver: bridge
